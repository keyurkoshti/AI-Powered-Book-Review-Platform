{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'login.css' %}">
</head>
<body>

<div class="login-container">
    <h2>Login</h2>

    <form id="loginform">
        {% csrf_token %}

        <input
            type="text"
            id="username"
            placeholder="Username or Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">Login</button>
    </form>

    <p id="error" class="error"></p>

    <p>
        Don't have an account?
        <a href="{% url 'register' %}">Register</a>
    </p>

</div>

<script src="{% static 'book_review_js/login.js' %}"></script>

</body>
</html>
