{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Profile</title>

        <link rel="stylesheet" href="{% static 'profile.css' %}">
    </head>
    <body>
        <div class="profile-container">
            
            <h2>User Profile</h2>

                <p><strong>Username:</strong> <span id="username"></span></p>

                <p><strong>Email:</strong> <span id="email"></span></p>

                <p><strong>Date Joined:</strong> <span id="date_joined"></span></p>

                <p><strong>Total Reviews:</strong> <span id="reviews_count"></span></p>

                <hr>

                <a href="{% url 'home' %}" class="back-btn">← Back to Home</a>

        </div>

        <script src="{% static 'book_review_js/auth.js' %}"></script>
        <script src="{% static 'book_review_js/profile.js' %}"></script>

    </body>
</html>
