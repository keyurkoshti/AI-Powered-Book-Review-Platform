{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Profile</title>

        <link rel="stylesheet" href="{% static 'profile.css' %}">
    </head>
    <body>
        <div class="profile-container">
            
            <h2>User Profile</h2>

                <p><strong>Username:</strong> <span id="username">{{ user.user_name }}</span></p>

                <p><strong>Email:</strong> <span id="email">{{ user.email }}</span></p>

                <p><strong>Date Joined:</strong> <span id="date_joined">{{ user.date_joined|date:"m/d/Y" }}</span></p>

                <p><strong>Total Reviews:</strong> <span id="reviews_count">{{ user.reviews_count }}</span></p>

                <hr>

                <a href="{% url 'home' %}" class="back-btn">← Back to Home</a>

        </div>

        {% comment %} 
        <script src="{% static 'book_review_js/auth.js' %}"></script>
        <script src="{% static 'book_review_js/profile.js' %}"></script>
        {% endcomment %}

    </body>
</html>
